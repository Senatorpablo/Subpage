        ];
        this.cryptoPrices = {
          BTC: 50000, ETH: 1700, SOL: 50, USDT: 1, USDC: 1,
          BNB: 320, ADA: 0.45, XRP: 0.52, DOGE: 0.08, MATIC: 0.75
        };

      login(email, password) {
        const user = this.users.find(u => u.email === email && u.password === password);
        if (user) {
          const { password, ...userWithoutPassword } = user;
          return { success: true, user: userWithoutPassword };
        }
        return { success: false, error: 'Invalid credentials' };
      }

      getTransactions(userId, filters = {}) {
        let txs = this.transactions.filter(t => t.userId === userId);
        if (filters.status) txs = txs.filter(t => t.status === filters.status);
        return txs.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      createTransaction(userId, txData) {
        const newTx = {
          id: this.transactions.length + 1,
          userId, ...txData, status: 'processing',
          date: new Date().toISOString(), txHash: null
        };
        this.transactions.unshift(newTx);
        setTimeout(() => {
          newTx.status = 'completed';
          newTx.txHash = '0x' + Math.random().toString(16).substr(2, 16) + '...';
        }, 3000);
        return { success: true, transaction: newTx };
      }

      getCryptoPrices() { return this.cryptoPrices; }

      updateKYC(userId) {
        const user = this.users.find(u => u.id === userId);
        if (user) {
          user.kycStatus = 'pending';
          setTimeout(() => {
            user.kycStatus = 'verified';
            user.kycLevel = 2;
          }, 5000);
          return { success: true };
        }
        return { success: false };
      }
    }
